name: Update Season Meta

on:
  schedule:
    # 08:00 CST (China Standard Time) = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-meta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Update season meta
        run: bun run scripts/update-season-meta.ts

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/season-meta.json
          if git diff --cached --quiet; then
            echo "No meta changes to commit."
          else
            git commit -m "chore: update season meta data [skip ci]"
            git push
          fi
